<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI design mockups</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111; color: #f4f4f5; font-family: system-ui, sans-serif; }
      main { max-width: 1440px; margin: 0 auto; padding: 2rem; }
      h1 { margin: 0 0 2rem; font-size: 1.125rem; font-weight: 500; }
      section { margin: 0 0 3rem; }
      h2 { margin: 0 0 1.25rem; font-size: 1.5rem; }
      h3 { margin: 1.5rem 0 .75rem; font-size: 1rem; font-weight: 500; }
      .preview-link { color: #fff; font-size: .875rem; text-underline-offset: .2em; }
      .screenshots { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .75rem; }
      img { display: block; width: 100%; height: auto; border-radius: .25rem; }
    </style>
  </head>
  <body>
    <main id="mockups"></main>
    <script>
      const models = [
        ['Astra', [['low', 'astra-low']]],
        ['Sol', [['medium', 'sol-medium'], ['low', 'sol-low']]],
        ['Terra', [['high', 'terra-high'], ['low', 'terra-low']]],
        ['Luna', [['high', 'luna-high'], ['low', 'luna-low']]]
      ];
      const screens = ['issues', 'issue-new', 'issue-details', 'projects', 'statuses'];
      document.querySelector('#mockups').innerHTML = `
        <h1><a class="preview-link" href="https://juhapalomaki.fi/blog/openai-codex-ui-model-comparison/">Blog post</a></h1>
        ${models.map(([name, configurations]) => `
          <section>
            <h2>${name}</h2>
            ${configurations.map(([effort, prefix]) => `
              <h3>${effort} — <a class="preview-link" href="${name.toLowerCase()}/${effort}/">Open full preview</a></h3>
              ${name === 'Astra' ? `<p><a class="preview-link" href="astra/low/index.html" download="astra-low.html">Download HTML</a></p>` : ''}
              <div class="screenshots">
                ${screens.map((screen) => `<img src="screenshots/${prefix}-${screen}.png" alt="" loading="lazy" />`).join('')}
              </div>
            `).join('')}
          </section>
        `).join('')}
      `;
    </script>
  </body>
</html>
