<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UI design mockups</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #111; }
      a { position: fixed; z-index: 1; top: 1rem; right: 1rem; padding: .5rem .75rem; border-radius: .4rem; background: rgba(17, 17, 17, .72); color: white; font: 14px system-ui, sans-serif; text-decoration: none; }
      main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1px; background: #111; }
      img { display: block; width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <a href="https://juhapalomaki.fi/blog/openai-codex-ui-model-comparison/">Blog post</a>
    <main id="screenshots"></main>
    <script>
      const screenshots = [
        'luna-high-issue-details.png', 'luna-high-issue-new.png', 'luna-high-issues.png', 'luna-high-projects.png', 'luna-high-statuses.png',
        'luna-low-issue-details.png', 'luna-low-issue-new.png', 'luna-low-issues.png', 'luna-low-projects.png', 'luna-low-statuses.png',
        'sol-low-issue-details.png', 'sol-low-issue-new.png', 'sol-low-issues.png', 'sol-low-projects.png', 'sol-low-statuses.png',
        'sol-medium-issue-details.png', 'sol-medium-issue-new.png', 'sol-medium-issues.png', 'sol-medium-projects.png', 'sol-medium-statuses.png',
        'terra-high-issue-details.png', 'terra-high-issue-new.png', 'terra-high-issues.png', 'terra-high-projects.png', 'terra-high-statuses.png',
        'terra-low-issue-details.png', 'terra-low-issue-new.png', 'terra-low-issues.png', 'terra-low-projects.png', 'terra-low-statuses.png'
      ];
      document.querySelector('#screenshots').innerHTML = screenshots.map((filename) => `<img src="screenshots/${filename}" alt="" />`).join('');
    </script>
  </body>
</html>
